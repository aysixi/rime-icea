patch:
  switches:
    - name: ascii_mode
      states: [中, Ａ]
    - name: ascii_punct # 中英标点
      states: [¥, $]
      reset: 1
    - name: traditionalization
      states: [简, 繁]
    - name: emoji
      states: [❄️, 🌸]
      reset: 0
    - name: full_shape
      states: [半角, 全角]
    - name: search_single_char # search.lua 的功能开关，辅码查词时是否单字优先
      states: [正常, 单字]
      abbrev: [词, 单]

  engine/translators:
    - punct_translator
    - script_translator
    # - lua_translator@*date_translator    # 时间、日期、星期
    # - lua_translator@*lunar              # 农历
    # - lua_translator@*uuid               # UUID
    - table_translator@custom_phrase # 自定义短语 custom_phrase.txt
    - table_translator@melt_eng # 英文输入
    - table_translator@cn_en # 中英混合词汇
    - table_translator@radical_lookup # 部件拆字反查
    - lua_translator@*unicode # Unicode
    - lua_translator@*number_translator # 数字、金额大写
    - lua_translator@*calc_translator # 计算器
    - lua_translator@*force_gc # 暴力 GC

  # 语言模型
  # 选项详解:  https://github.com/LEOYoon-Tsaw/Rime_collections/blob/master/Rime_description.md
  grammar:
    language: wanxiang-lts-zh-hans
    collocation_max_length: 8
    collocation_min_length: 2
    collocation_penalty: -16
    non_collocation_penalty: -8
    weak_collocation_penalty: -100
    rear_penalty: -20

  # 设置挂载词库
  translator/dictionary: rime_ice_private

  # translator 内加载
  "translator/contextual_suggestions": true
  "translator/max_homophones": 7
  "translator/max_homographs": 7

  # 次翻译器，英文
  melt_eng:
    dictionary: melt_eng # 挂载词库 melt_eng.dict.yaml
    enable_sentence: false # 禁止造句
    enable_user_dict: false # 禁用用户词典
    initial_quality: 0.5 # 初始权重
    comment_format: # 自定义提示码
      - xform/.*// # 清空提示码

  key_binder:
    import_preset: default # 从 default.yaml 继承通用的
    search: "`" # 辅码引导符，要添加到 speller/alphabet
    bindings: # 也可以再增加方案专有的
      - { when: always, accept: Shift+Q, select: rime_ice }
      - { when: always, accept: Shift+E, select: kagiroi }
